version: '3.8'
services:
    dev-mysql:
      image: mysql:latest
      ports:
        - "3307:3306"
      environment:
        MYSQL_HOST: "localhost"
        MYSQL_USER: "user"
        MYSQL_PASSWORD: "password"
        MYSQL_DB: "memo_db"
      volumes:
        - mysql_data:/var/lib/mysql/data
      restart: always

volumes:
  mysql_data:
    driver: local


